name: Loophole quality gates
on:
  push:
    branches: [main, master, milestone/loophole-v2]
  pull_request:
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install contract verification tools
        run: pip install -r requirements.txt
      - name: Run real GenVM lint
        run: |
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check contracts/Loophole.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check contracts/LoopholeV2.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check contracts/historical/RuleVault.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check contracts/historical/GapJudge.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check diagnostics/AdjudicationProbe.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check diagnostics/CrossContractRelay.py
          GENVM_VERSION=v0.3.0-rc7 genvm-lint check diagnostics/DirectGapJudgeWorkloadProbe.py
      - name: Compile Python
        run: python -m compileall -q contracts diagnostics scripts
      - name: Validate GenVM runner headers
        run: python scripts/validate_runner_headers.py contracts/Loophole.py contracts/LoopholeV2.py contracts/historical/RuleVault.py contracts/historical/GapJudge.py diagnostics/AdjudicationProbe.py diagnostics/CrossContractRelay.py diagnostics/DirectGapJudgeWorkloadProbe.py
      - name: Verify production and diagnostic prompt parity
        run: python scripts/verify_prompt_parity.py
      - name: Run protocol state-machine tests
        run: python -m pytest tests -m "not direct" -q
      - name: Verify source-backed and mutation behavior explicitly
        run: python -m pytest tests/test_monolith_protocol.py tests/test_monolith_mutation_behavior.py tests/test_v2_mutation_behavior.py -q
      - name: Run GenVM Direct Mode tests
        env:
          GENVM_GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest tests/direct -m direct -q
      - name: Run source invariants
        run: python scripts/preflight.py
      - name: Verify active release consistency
        run: python scripts/verify_release_integrity.py
      - name: Verify V2 source integrity
        run: python scripts/verify_v2_source.py
      - name: Test delivery state classification
        run: node --test scripts/delivery_classifier.test.mjs
      - name: Test reusable V2 SDK
        run: node --test sdk/test/sdk.test.mjs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies (repo-local CLI only)
        run: npm ci --no-audit --no-fund && npm --prefix frontend ci --no-audit --no-fund
      - name: Enforce local CLI version
        run: node -e "const p=require('./node_modules/genlayer/package.json');if(p.version!=='0.39.1')process.exit(1)"
      - name: Audit repository production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm --prefix frontend run typecheck
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Audit frontend lockfile
        run: npm --prefix frontend audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm --prefix frontend run test:e2e
